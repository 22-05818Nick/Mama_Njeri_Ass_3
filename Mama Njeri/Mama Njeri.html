<form action="#" method="post">
    <legend>Student Registration Form</legend>
    
<fieldset>
    <label for="firstname"> First Name</label>
    <input type="Text" name="firstname" id="firstname" placeholder="Enter your First Name" required>

    <br><br>
    
    <label for="lastname"> Last Name</label>
    <input type="Text" name="lastname" id="lastname" placeholder="Enter your Last Name" required>
</fieldset>
    <br><br>

<fieldset>
    <label for="email"> Email </label>
    <input type="Text" name="email" id="email" placeholder="Enter your Email" required>

    <br><br>

    <label for="lastname"> Phone Number</label>
    <input type="Text" name="phonenumber" id="phonenumber" placeholder="Enter your Phone Number" required>

    <br><br>

    <label for="D.O.B"> Date of Birth </label>
    <input type="Text" name="D.O.B" id="D.O.B" placeholder="Enter your Date of Birth" required>

    <br><br>

    <label for="gender"> Gender</label>
    <input type="Text" name="gender" id="gender" placeholder="Enter your Gender" required>
</fieldset>
    <br><br>

<fieldset>
    <label for="Course"> Course </label>
    <input type="Text" name="Course" id="Course" placeholder="Enter your Course" required>

    <br><br>

    <input type="Text" name="Year of Study" id="Year of Study" placeholder="Enter your Year of Study" required>

    <br><br>
